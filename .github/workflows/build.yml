name: Build single-file binaries (PyInstaller)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: hh-parser-windows
            out: HH-Parser.exe
          - os: macos-14
            artifact: hh-parser-macos
            out: HH-Parser

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build (PyInstaller onefile)
        run: |
          pyinstaller --onefile --windowed --name "${{ matrix.out }}" main.py

      - name: Remove macOS quarantine attrs
        if: runner.os == 'macOS'
        run: |
          xattr -cr "dist/${{ matrix.out }}" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.out }}
