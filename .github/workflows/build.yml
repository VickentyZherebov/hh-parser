name: Build desktop apps

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build
        run: |
          flet build ${{ matrix.os == 'windows-latest' && 'windows' || 'macos' }} app.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hh-parser-${{ matrix.os }}
          path: build/
