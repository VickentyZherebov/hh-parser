name: Build desktop apps

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false  # <— важно: не отменять macOS если Windows упал
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---- Windows build (чинит UnicodeEncodeError в rich) ----
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          chcp 65001
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()
          $env:PYTHONUTF8 = "1"
          $env:PYTHONIOENCODING = "utf-8"
          flet build windows --module-name main

      # ---- macOS build ----
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          flet build macos --module-name main

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hh-parser-${{ matrix.os }}
          path: build/
